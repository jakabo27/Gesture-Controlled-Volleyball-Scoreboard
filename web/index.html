<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Live score from the gesture-controlled volleyball scoreboard, over Bluetooth LE.">
  <title>Scoreboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="board" class="board" aria-label="Score">
    <section class="side" id="side-left">
      <div class="team-label"></div>
      <svg class="digits" viewBox="-3 -3 228 186" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </section>
    <div class="divider" aria-hidden="true"></div>
    <section class="side" id="side-right">
      <div class="team-label"></div>
      <svg class="digits" viewBox="-3 -3 228 186" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </section>
  </main>
  <p id="score-text" class="visually-hidden" aria-live="polite"></p>

  <header class="bar bar-top">
    <div class="pills">
      <span id="link-pill" class="pill"><span class="dot"></span><span class="pill-text">Not connected</span></span>
      <span id="gesture-pill" class="pill pill-quiet" hidden><span class="dot"></span><span class="pill-text">Camera scoring</span></span>
    </div>
    <div id="game-clock" class="game-clock idle" hidden title="Game time: starts with the first point after 0–0" aria-label="Game clock">0:00</div>
    <div class="buttons">
      <button id="btn-theme" class="icon-btn" aria-label="Switch to night mode" title="Day / night">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
      </button>
      <button id="btn-fullscreen" class="icon-btn" aria-label="Full screen" title="Full screen">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <footer class="bar bar-bottom">
    <span id="game-info"></span>
    <span id="stale-note" class="warn" hidden></span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="assertive"><div class="toast-main"></div><div class="toast-sub"></div></div>

  <div id="connect" class="overlay">
    <div class="card">
      <h1>Scoreboard</h1>
      <p id="connect-msg">Live score from the scoreboard over Bluetooth. No Wi-Fi needed.</p>
      <button id="btn-connect" class="primary">Connect</button>
      <p class="hint">The scoreboard shows up about 30 seconds after it's switched on.</p>
      <button id="btn-demo" class="link">Try the demo</button>
    </div>
  </div>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>

      <fieldset id="board-settings" class="span-all">
        <legend>Scoreboard <span id="board-settings-note" class="legend-note"></span></legend>
        <div class="seg-row">
          <span class="seg-label">Sport</span>
          <div class="seg" role="group" aria-label="Sport">
            <button type="button" data-cmd="MODE" data-value="0">Volleyball</button>
            <button type="button" data-cmd="MODE" data-value="1">Tennis</button>
          </div>
        </div>
        <div class="seg-row">
          <span class="seg-label">Game to</span>
          <div class="seg" role="group" aria-label="Volleyball game to">
            <button type="button" data-cmd="TO" data-value="15">15</button>
            <button type="button" data-cmd="TO" data-value="21">21</button>
            <button type="button" data-cmd="TO" data-value="25">25</button>
          </div>
        </div>
      </fieldset>


      <fieldset>
        <legend>Where is this phone?</legend>
        <label class="choice"><input type="radio" name="layout" value="behind">
          <span><b>Behind the scoreboard</b><small>Mirrored: AWAY on the left, HOME on the right</small></span></label>
        <label class="choice"><input type="radio" name="layout" value="front">
          <span><b>In front of the scoreboard</b><small>Same as the players see it: HOME on the left</small></span></label>
      </fieldset>

      <fieldset>
        <legend>Screen</legend>
        <label class="choice"><input type="radio" name="theme" value="day">
          <span><b>Day</b><small>White background, dark digits: easiest to read in the sun</small></span></label>
        <label class="choice"><input type="radio" name="theme" value="night">
          <span><b>Night</b><small>Black background, bright digits for stadium lights</small></span></label>
      </fieldset>

      <fieldset>
        <legend>Team colors</legend>
        <label class="choice"><input type="radio" name="colorStyle" value="digits">
          <span><b>Colored numbers</b><small>Like the scoreboard's LEDs</small></span></label>
        <label class="choice"><input type="radio" name="colorStyle" value="background">
          <span><b>Colored background</b><small>Each half filled with its team color</small></span></label>
      </fieldset>


      <label class="toggle"><input type="checkbox" name="wakeLock"> Keep the screen on</label>

      <div class="dialog-actions">
        <button type="button" id="btn-disconnect" class="secondary">Disconnect</button>
        <button value="close" class="primary">Done</button>
      </div>
      <p class="fineprint" id="version"></p>
    </form>
  </dialog>

  <script src="protocol.js"></script>
  <script src="app.js"></script>
</body>
</html>
