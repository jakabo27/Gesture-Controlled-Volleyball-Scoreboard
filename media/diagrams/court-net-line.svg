<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b07d50"/>
    </linearGradient>
    <linearGradient id="overlapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: Camera Frame 1280x720 -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>
  
  <!-- Ground (Sand / Gym Court) with perspective -->
  <polygon points="0,480 1280,480 1280,720 0,720" fill="url(#sandGrad)"/>
  
  <!-- Perspective Court Boundary Lines -->
  <!-- Left Court -->
  <line x1="80" y1="720" x2="480" y2="480" stroke="#fefae0" stroke-width="3" stroke-dasharray="8,6"/>
  <!-- Right Court -->
  <line x1="1200" y1="720" x2="800" y2="480" stroke="#fefae0" stroke-width="3" stroke-dasharray="8,6"/>
  <!-- Baseline back boundary -->
  <line x1="480" y1="480" x2="800" y2="480" stroke="#fefae0" stroke-width="2"/>

  <!-- Net Pole Silhouette on near side (under which camera sits) -->
  <rect x="625" y="0" width="30" height="720" fill="#334155" opacity="0.3"/>
  <line x1="0" y1="260" x2="1280" y2="260" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- ==================== +/-7% NET-LINE DRIFT CLAMP ==================== -->
  <!-- Width is 1280. Center is 640. 7% is ~90 pixels each way -> [550 to 730] -->
  <rect x="550" y="60" width="180" height="600" fill="url(#overlapGrad)" rx="8" filter="url(#shadow)"/>
  
  <!-- Left Bound Line (0.43 = 550px) -->
  <line x1="550" y1="60" x2="550" y2="660" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Right Bound Line (0.55 = 704px) -->
  <line x1="730" y1="60" x2="730" y2="660" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Nominal Center Line (0.50 = 640px) -->
  <line x1="640" y1="40" x2="640" y2="680" stroke="#06b6d4" stroke-width="4"/>

  <!-- Labels on the Center Line and Bounds -->
  <rect x="520" y="20" width="240" height="34" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
  <text x="640" y="43" fill="#22d3ee" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    Nominal Net Center (X = 0.50)
  </text>

  <!-- Dimension Indicator for 5% Drift (64px left, 64px right = 128px / 10% total) -->
  <line x1="550" y1="90" x2="730" y2="90" stroke="#fefae0" stroke-width="2"/>
  <circle cx="550" cy="90" r="4" fill="#f59e0b"/>
  <circle cx="730" cy="90" r="4" fill="#f59e0b"/>
  <rect x="575" y="76" width="130" height="26" rx="4" fill="#1e293b"/>
  <text x="640" y="94" fill="#fefae0" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    ±7% drift clamp
  </text>

  <!-- Side Annotations: Left & Right Teams -->
  <!-- Left Team Zone -->
  <rect x="120" y="100" width="340" height="80" rx="8" fill="#1e293b" opacity="0.9" stroke="#3b82f6" stroke-width="2"/>
  <text x="290" y="132" fill="#60a5fa" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
    HOME TEAM (LEFT)
  </text>
  <text x="290" y="160" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    All torso centroids X &lt; Center Line
  </text>

  <!-- Right Team Zone -->
  <rect x="820" y="100" width="340" height="80" rx="8" fill="#1e293b" opacity="0.9" stroke="#ef4444" stroke-width="2"/>
  <text x="990" y="132" fill="#f87171" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
    AWAY TEAM (RIGHT)
  </text>
  <text x="990" y="160" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    All torso centroids X &gt; Center Line
  </text>

  <!-- Player Near Net Illustration (Chest inside Home side, Arm reaches into Overlap) -->
  <!-- Player Silhouette on Left Side near Net -->
  <g transform="translate(490, 320)">
    <!-- Head -->
    <circle cx="30" cy="20" r="14" fill="#60a5fa"/>
    <!-- Torso -->
    <rect x="20" y="36" width="20" height="70" rx="4" fill="#3b82f6"/>
    <!-- Torso Center centroid dot (X = ~0.42, safely Left) -->
    <circle cx="30" cy="70" r="6" fill="#fbbf24"/>
    <!-- Left Arm outstretched towards the Net into the 5% overlap zone -->
    <line x1="40" y1="46" x2="172" y2="46" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <!-- Right Arm outstretched away from net -->
    <line x1="20" y1="46" x2="-45" y2="46" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="24" y1="106" x2="18" y2="190" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <line x1="36" y1="106" x2="42" y2="190" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
    <!-- Callout on Outstretched Hand crossing into Overlap -->
    <path d="M 172,46 Q 185,20 200,20" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <rect x="200" y="6" width="250" height="36" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="325" y="29" fill="#fefae0" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
      Hand reaches across the net line
    </text>
    <!-- Callout on Torso Centroid -->
    <path d="M 30,70 Q 0,90 -20,90" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-240" y="75" width="215" height="48" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="-132" y="94" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Torso Center (Chest) X = 0.41
    </text>
    <text x="-132" y="112" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">
      The point still goes to HOME
    </text>
  </g>

  <!-- Bottom Explanatory Legend Card -->
  <g transform="translate(180, 570)" filter="url(#shadow)">
    <rect width="920" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="30" y="32" fill="#38bdf8" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Keeping the net line trustworthy:
    </text>
    <text x="30" y="60" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">
      1. <tspan font-weight="bold" fill="#f59e0b">Hard clamp [0.43 - 0.57]:</tspan> the auto-calibrated line follows real camera aim (about ±7° on a ~100° lens) and never drifts further.
    </text>
    <text x="30" y="82" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">
      2. <tspan font-weight="bold" fill="#60a5fa">Torso-centroid attribution:</tspan> a player's team comes from their chest center (midpoint of shoulders and hips), not their hands.
    </text>
    <text x="30" y="104" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">
      3. <tspan font-weight="bold" fill="#34d399">Reaching over the net:</tspan> each half-frame is inferred with a 12% overlap, so an arm across the line is never cropped off.
    </text>
  </g>
</svg>
