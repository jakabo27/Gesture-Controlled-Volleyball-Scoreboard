<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0f172a"/>

  <!-- Top Banner Header -->
  <rect x="50" y="20" width="1180" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="640" y="48" fill="#38bdf8" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">
    Handling Court Realities: Camera Tilt on Sand &amp; Wide-Angle Edge Distortion
  </text>
  <text x="640" y="70" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    Spine-relative geometry, keystone correction and edge-adaptive thresholds keep real T-poses scoring
  </text>

  <!-- ==================== LEFT HALF: SAND TILT (ROLL / PITCH CORRECTION) ==================== -->
  <g transform="translate(50, 105)" filter="url(#boxShadow)">
    <rect width="570" height="580" rx="10" fill="url(#panelBg)" stroke="#334155" stroke-width="2"/>
    <text x="285" y="36" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      Problem 1: Camera Tilted on Uneven Sand
    </text>

    <!-- Uneven Sand Slope Line (e.g. 10 degree tilt) -->
    <path d="M 30,280 L 540,210 L 540,320 L 30,320 Z" fill="#d4a373" opacity="0.4"/>
    <line x1="30" y1="280" x2="540" y2="210" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="440" y="200" fill="#fbbf24" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Sand Slope (~9° Tilt)
    </text>

    <!-- Naive Camera Pixel Horizon (Horizontal line in image coordinates) -->
    <line x1="30" y1="170" x2="540" y2="170" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="36" y="190" fill="#f87171" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      Camera pixel grid (0°)
    </text>

    <!-- Tilted Player Skeleton (Standing perpendicular to gravity, but tilted relative to camera frame!) -->
    <!-- Rotate around player center (cx=270, cy=180) by -9 degrees -->
    <g transform="translate(0, 24) rotate(-9, 270, 180)">
      <!-- Player Spine Axis (Green vector) -->
      <line x1="270" y1="70" x2="270" y2="290" stroke="#22c55e" stroke-width="3"/>
      
      <!-- Head -->
      <circle cx="270" cy="50" r="20" fill="#38bdf8"/>
      <!-- Shoulders -->
      <line x1="210" y1="120" x2="330" y2="120" stroke="#f8fafc" stroke-width="6" stroke-linecap="round"/>
      <!-- Arms (Perpendicular to spine, level with true gravity) -->
      <line x1="210" y1="120" x2="100" y2="120" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <line x1="330" y1="120" x2="440" y2="120" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <!-- Keypoint joints -->
      <circle cx="100" cy="120" r="5" fill="#fbbf24"/>
      <circle cx="210" cy="120" r="5" fill="#fbbf24"/>
      <circle cx="330" cy="120" r="5" fill="#fbbf24"/>
      <circle cx="440" cy="120" r="5" fill="#fbbf24"/>
      <!-- Hips -->
      <line x1="230" y1="210" x2="310" y2="210" stroke="#f8fafc" stroke-width="5"/>
      <circle cx="230" cy="210" r="5" fill="#fbbf24"/>
      <circle cx="310" cy="210" r="5" fill="#fbbf24"/>
      <!-- Legs -->
      <line x1="230" y1="210" x2="230" y2="300" stroke="#94a3b8" stroke-width="5"/>
      <line x1="310" y1="210" x2="310" y2="300" stroke="#94a3b8" stroke-width="5"/>

      <!-- Perpendicular 90 degree square indicator between spine and shoulder line -->
      <rect x="270" y="120" width="14" height="14" fill="none" stroke="#22c55e" stroke-width="2"/>
      <circle cx="277" cy="127" r="2" fill="#22c55e"/>
    </g>

    <!-- Contrast Callout Box -->
    <g transform="translate(30, 340)">
      <rect width="510" height="215" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      
      <text x="20" y="30" fill="#ef4444" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
        ❌ Naive Image-Coordinate Check (Fails on Sand):
      </text>
      <text x="36" y="52" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        If checking <tspan font-family="monospace">abs(left_wrist_y - right_wrist_y) &lt; 0.08</tspan>, a camera tilted 9°
      </text>
      <text x="36" y="70" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        causes a 45px vertical delta between wrists, falsely rejecting valid poses!
      </text>

      <line x1="20" y1="88" x2="490" y2="88" stroke="#334155" stroke-width="1"/>

      <text x="20" y="112" fill="#22c55e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
        ✅ Our Solution: Torso-Relative Spine Coordinates:
      </text>
      <text x="36" y="134" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        We compute the vector from the player's hip midpoint to their shoulder midpoint.
      </text>
      <text x="36" y="154" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        Arms are evaluated <tspan font-weight="bold" fill="#38bdf8">relative to the player's spine</tspan> (must be 90° ± 20° to the torso).
      </text>
      <text x="36" y="174" fill="#22d3ee" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
        A keystone model also removes the lean at the frame edges.
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT HALF: WIDE-ANGLE LENS PERSPECTIVE ==================== -->
  <g transform="translate(660, 105)" filter="url(#boxShadow)">
    <rect width="570" height="580" rx="10" fill="url(#panelBg)" stroke="#334155" stroke-width="2"/>
    <text x="285" y="36" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
      Problem 2: Wide-Angle Lens Edge Distortion
    </text>

    <!-- Wide Angle FOV Curved Arc on Top -->
    <path d="M 40,80 Q 285,130 530,80" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="285" y="128" fill="#818cf8" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ~100° Wide-Angle USB Camera Field of View
    </text>

    <!-- Player in Center Court vs Player on Extreme Sideline -->
    <!-- Player A: Center Court (Straight on view) -->
    <g transform="translate(130, 150)">
      <circle cx="40" cy="20" r="14" fill="#38bdf8"/>
      <line x1="40" y1="34" x2="40" y2="90" stroke="#f8fafc" stroke-width="4"/>
      <!-- Symmetrical arms -->
      <line x1="0" y1="46" x2="80" y2="46" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="90" x2="25" y2="140" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="50" y1="90" x2="55" y2="140" stroke="#cbd5e1" stroke-width="4"/>
      <text x="40" y="162" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
        Center Court (X ≈ 0.50)
      </text>
      <text x="40" y="178" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
        Wingspan ≥ 1.85×
      </text>
    </g>

    <!-- Perspective Ray Lines from Camera at bottom center -->
    <line x1="285" y1="310" x2="170" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="285" y1="310" x2="420" y2="150" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="285" cy="310" r="6" fill="#06b6d4"/>
    <text x="285" y="328" fill="#22d3ee" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      Camera
    </text>

    <!-- Player B: Far Sideline (Angle of view is ~45°! Appears foreshortened) -->
    <g transform="translate(380, 150)">
      <circle cx="40" cy="20" r="14" fill="#a855f7"/>
      <line x1="40" y1="34" x2="40" y2="90" stroke="#f8fafc" stroke-width="4"/>
      <!-- Foreshortened arm towards camera vs outstretched arm away -->
      <line x1="15" y1="46" x2="72" y2="46" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="90" x2="25" y2="140" stroke="#cbd5e1" stroke-width="4"/>
      <line x1="50" y1="90" x2="55" y2="140" stroke="#cbd5e1" stroke-width="4"/>
      <text x="40" y="162" fill="#c084fc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
        Far Sideline (X &lt; 0.20 or &gt; 0.80)
      </text>
      <text x="40" y="178" fill="#f87171" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
        Foreshortened: ≥ 1.70×
      </text>
    </g>

    <!-- Edge Adaptation Callout Box -->
    <g transform="translate(30, 340)">
      <rect width="510" height="215" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      
      <text x="20" y="30" fill="#f59e0b" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
        ⚠️ The Wide-Angle Edge Distortion Effect:
      </text>
      <text x="36" y="52" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        A player on the deep left sideline is viewed at a steep 45° angle.
      </text>
      <text x="36" y="70" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        Their arms extend partially along the camera's Z-axis (towards/away),
      </text>
      <text x="36" y="88" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        causing their visible pixel wingspan to appear 15-20% shorter.
      </text>

      <line x1="20" y1="104" x2="490" y2="104" stroke="#334155" stroke-width="1"/>

      <text x="20" y="128" fill="#22c55e" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
        ✅ Our Edge-Adaptive Geometric Threshold:
      </text>
      <text x="36" y="150" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        • Center Court (<tspan font-family="monospace">0.25 &lt; X &lt; 0.75</tspan>): Requires wingspan ratio ≥ 1.85×.
      </text>
      <text x="36" y="170" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="12">
        • Far Sidelines (<tspan font-family="monospace">toward X = 0 or 1</tspan>): ratio eases linearly down to 1.70×.
      </text>
      <text x="36" y="192" fill="#22d3ee" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
        Elbow straightness (≥ 135°) stays strict everywhere to keep false positives out.
      </text>
    </g>
  </g>
</svg>
